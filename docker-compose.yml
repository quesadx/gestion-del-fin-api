# The "what"
# This file defines the services that make up the application, so they can be run together in an isolated environment.
# 'volumes', 'ports', 'environment' are some of the options that can be used to configure the services.
# They are all inside 'db' because we only have one service, which is the database.
services:
  # 'db' refers to the database itself
  # it works as a DNS name, so we can use it to connect to the database from other services (if we had any)
  # example: db:5432 would be the address to connect to the database from another service
  db:
    # PostgreSQL image
    image: postgres:16-alpine
    container_name: gestion-del-fin-db
    environment:
      - POSTGRES_DB=gestion_del_fin
      - POSTGRES_USER=gestion_user
      - POSTGRES_PASSWORD=admin
      - POSTGRES_INITDB_ARGS=-c shared_preload_libraries=pg_stat_statements
    ports:
      - '5432:5432'
    volumes:
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
      # Allows to run the migrations when the container starts
      # PostgreSQL will execute any .sql or .sh files in this directory during startup
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gestion_user']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ml:
    build: ./ml-service
    container_name: gestion-del-fin-ml
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  valkey:
    image: valkey/valkey:7
    container_name: gestion-del-fin-valkey
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  # This is a named volume that can be used to persist data across container restarts.
  # It is not used in this configuration, but it can be useful for storing database data or other persistent data.
  db_data:
