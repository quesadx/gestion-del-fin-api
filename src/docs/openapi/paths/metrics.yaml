/api/metrics/dashboard:
  get:
    tags: [Metrics]
    summary: 'Get camp dashboard metrics'
    description: "Returns dashboard-level summary metrics for the authenticated user's camp. Requires metrics.dashboard permission."
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 'Dashboard metrics retrieved.'
        content:
          application/json:
            schema:
              type: object
              properties:
                survivor_count:
                  type: integer
                  example: 150
                healthy_count:
                  type: integer
                  example: 120
                injured_count:
                  type: integer
                  example: 15
                absent_count:
                  type: integer
                  example: 10
                resource_types_count:
                  type: integer
                  example: 12
                total_resources_value:
                  type: number
                  format: float
                  example: 5000.5
                active_expeditions_count:
                  type: integer
                  example: 2
                pending_transfers_count:
                  type: integer
                  example: 3
                low_resource_alerts_count:
                  type: integer
                  example: 5
      '401':
        description: 'Missing or invalid authentication.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/metrics/resources:
  get:
    tags: [Metrics]
    summary: 'Get resource metrics'
    description: "Returns resource-related metrics for the authenticated user's camp. Requires metrics.resources permission."
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 'Resource metrics retrieved.'
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  resource_id:
                    type: integer
                    example: 1
                  resource_name:
                    type: string
                    example: 'Canned Food'
                  quantity_current:
                    type: number
                    format: float
                    example: 500.0
                  quantity_min_threshold:
                    type: number
                    format: float
                    example: 100.0
                  quantity_max_capacity:
                    type: number
                    format: float
                    nullable: true
                    example: null
                  status:
                    type: string
                    enum: [OK, LOW, CRITICAL, OVERSTOCKED]
                    example: OK
      '401':
        description: 'Missing or invalid authentication.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/metrics/people:
  get:
    tags: [Metrics]
    summary: 'Get people metrics'
    description: "Returns people-related metrics for the authenticated user's camp. Requires metrics.people permission."
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 'People metrics retrieved.'
        content:
          application/json:
            schema:
              type: object
              properties:
                total_survivors:
                  type: integer
                  example: 150
                by_profession:
                  type: array
                  items:
                    type: object
                    properties:
                      profession_name:
                        type: string
                        example: 'Medic'
                      count:
                        type: integer
                        example: 25
                by_status:
                  type: array
                  items:
                    type: object
                    properties:
                      status:
                        type: string
                        example: 'HEALTHY'
                      count:
                        type: integer
                        example: 120
                average_capacity_utilization_percent:
                  type: number
                  format: float
                  example: 0
      '401':
        description: 'Missing or invalid authentication.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/metrics/expeditions:
  get:
    tags: [Metrics]
    summary: 'Get expedition metrics'
    description: "Returns expedition-related metrics for the authenticated user's camp. Requires metrics.expeditions permission."
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 'Expedition metrics retrieved.'
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  expedition_id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: 'East Sector Mall'
                  status:
                    type: string
                    enum: [PLANNED, ONGOING, RETURNED, CANCELLED]
                    example: 'ONGOING'
                  participant_count:
                    type: integer
                    example: 5
                  resource_consumption_total:
                    type: number
                    format: float
                    example: 25.5
                  days_elapsed:
                    type: integer
                    example: 3
                  expected_return_date:
                    type: string
                    format: date
                    example: '2026-04-30'
      '401':
        description: 'Missing or invalid authentication.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
