/api/camps/{campId}/people:
  post:
    tags: [People]
    summary: 'Create person in camp'
    description: 'Creates a new person record within a camp. Requires people.create permission.'
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: campId
        required: true
        schema:
          type: integer
          minimum: 1
        description: 'Camp ID'
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - full_name
              - camp_id
              - profession_id
              - admitted_at
            properties:
              full_name:
                type: string
                minLength: 1
                maxLength: 150
                example: 'John Doe'
              camp_id:
                type: integer
                example: 1
              profession_id:
                type: integer
                example: 2
              admitted_at:
                type: string
                format: date-time
                example: '2026-04-25T14:05:30.000Z'
              status:
                type: string
                enum: [SICK, HEALTHY, INJURED, AWAY, DEAD]
                default: HEALTHY
              age:
                type: integer
                minimum: 0
                maximum: 255
                example: 32
              identification_code:
                type: string
                maxLength: 20
                example: 'S-001'
              blood_type:
                type: string
                maxLength: 5
                example: 'O+'
              skills_summary:
                type: string
                example: 'Medical training, basic combat'
              photo:
                type: string
                format: binary
    responses:
      '201':
        description: 'Person created.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Person'
      '400':
        description: 'Validation failed.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: 'Missing or invalid authentication.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: 'Camp not found.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  get:
    tags: [People]
    summary: 'List people by camp'
    description: 'Retrieves a paginated list of people within a camp. Requires people.read permission.'
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: campId
        required: true
        schema:
          type: integer
          minimum: 1
        description: 'Camp ID'
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
        description: 'Page number'
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: 'Items per page (max 100)'
    responses:
      '200':
        description: 'People retrieved.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaginatedResponse'
      '401':
        description: 'Missing or invalid authentication.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

