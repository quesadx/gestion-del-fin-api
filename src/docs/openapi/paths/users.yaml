/api/users:
  post:
    tags: [Users]
    summary: 'Create user'
    description: 'Creates a new system user. Requires users.create permission.'
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateUserRequest'
    responses:
      '201':
        description: 'User created.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      '400':
        description: 'Validation failed.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: 'Missing or invalid authentication.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: 'Username already exists.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  get:
    tags: [Users]
    summary: 'List users'
    description: 'Retrieves paginated list of users. Admins see all users; non-admins see only their camp users. Requires users.read permission.'
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
        description: 'Page number'
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: 'Items per page (max 100)'
    responses:
      '200':
        description: 'Users retrieved.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaginatedResponse'
      '401':
        description: 'Missing or invalid authentication.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/users/{id}:
  get:
    tags: [Users]
    summary: 'Get user by id'
    description: 'Retrieves a single user by ID. Requires users.read permission.'
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          minimum: 1
        description: 'User ID'
    responses:
      '200':
        description: 'User retrieved.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      '401':
        description: 'Missing or invalid authentication.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: 'User not found.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  put:
    tags: [Users]
    summary: 'Update user'
    description: 'Updates a user record. Requires users.update permission.'
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          minimum: 1
        description: 'User ID'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateUserRequest'
    responses:
      '200':
        description: 'User updated.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      '400':
        description: 'Validation failed.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: 'Missing or invalid authentication.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: 'User not found.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: 'Username already exists.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  delete:
    tags: [Users]
    summary: 'Deactivate user'
    description: 'Deactivates a user (sets is_active to false). Requires users.delete permission.'
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          minimum: 1
        description: 'User ID'
    responses:
      '204':
        description: 'User deactivated.'
      '401':
        description: 'Missing or invalid authentication.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: 'User not found.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
