        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/inventory/adjustment:
  post:
    tags: [Inventory]
    summary: 'Adjust inventory manually'
    description: 'Manually adjusts inventory (MANUAL_IN or MANUAL_OUT). Requires inventory.adjust permission. Non-admin users can only adjust their own camp inventory.'
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManualAdjustmentRequest'
    responses:
      '201':
        description: 'Inventory adjusted.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualAdjustmentResponse'
      '400':
        description: 'Validation failed.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: 'Missing or invalid authentication.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
