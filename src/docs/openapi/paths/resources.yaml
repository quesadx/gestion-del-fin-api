/api/resources:
  post:
    tags: [Resources]
    summary: 'Create resource type'
    description: 'Creates a new resource type in the catalog. Requires resources.create permission.'
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateResourceRequest'
    responses:
      '201':
        description: 'Resource created.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceType'
      '400':
        description: 'Validation failed.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: 'Missing or invalid authentication.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: 'Resource name already exists.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  get:
    tags: [Resources]
    summary: 'List resource types'
    description: 'Retrieves a paginated list of all resource types. Requires resources.read permission.'
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
        description: 'Page number'
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: 'Items per page (max 100)'
    responses:
      '200':
        description: 'Resources retrieved.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaginatedResponse'
      '401':
        description: 'Missing or invalid authentication.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/resources/{id}:
  get:
    tags: [Resources]
    summary: 'Get resource type by id'
    description: 'Retrieves a single resource type by ID. Requires resources.read permission.'
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          minimum: 1
        description: 'Resource type ID'
    responses:
      '200':
        description: 'Resource retrieved.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceType'
      '401':
        description: 'Missing or invalid authentication.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: 'Resource not found.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  put:
    tags: [Resources]
    summary: 'Update resource type'
    description: 'Updates a resource type. Requires resources.update permission.'
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          minimum: 1
        description: 'Resource type ID'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateResourceRequest'
    responses:
      '200':
        description: 'Resource updated.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceType'
      '400':
        description: 'Validation failed.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: 'Missing or invalid authentication.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: 'Resource not found.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: 'Resource name already exists.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  delete:
    tags: [Resources]
    summary: 'Delete resource type'
    description: 'Deletes a resource type. Requires resources.delete permission.'
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          minimum: 1
        description: 'Resource type ID'
    responses:
      '204':
        description: 'Resource deleted.'
      '401':
        description: 'Missing or invalid authentication.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: 'Resource not found.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
