/api/transfers:
  post:
    tags: [Transfers]
    summary: 'Create transfer request'
    description: 'Creates an inter-camp transfer request for resources and/or people. Requires transfers.create permission.'
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateTransferRequest'
    responses:
      '201':
        description: 'Transfer created.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transfer'
      '400':
        description: 'Validation failed.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: 'Missing or invalid authentication.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  get:
    tags: [Transfers]
    summary: 'List transfers'
    description: "Retrieves paginated list of transfers for the authenticated user's camp. Requires transfers.read permission."
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
        description: 'Page number'
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: 'Items per page (max 100)'
    responses:
      '200':
        description: 'Transfers retrieved.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaginatedResponse'
      '401':
        description: 'Missing or invalid authentication.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/transfers/{id}:
  get:
    tags: [Transfers]
    summary: 'Get transfer by id'
    description: 'Retrieves a single transfer with its items. Requires transfers.read permission.'
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          minimum: 1
        description: 'Transfer ID'
    responses:
      '200':
        description: 'Transfer retrieved.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transfer'
      '401':
        description: 'Missing or invalid authentication.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 'Insufficient permissions.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: 'Transfer not found.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

