name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npx prettier --check .

      - name: Run spell check
        run: npm run spell

      - name: Run unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gestion_user
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: gestion_del_fin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://gestion_user:admin@localhost:5432/gestion_del_fin_test
      JWT_SECRET: test-jwt-secret-at-least-32-characters-long-for-e2e
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to test database
        run: npx prisma db push --force-reset
        env:
          DATABASE_URL: postgresql://gestion_user:admin@localhost:5432/gestion_del_fin_test

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://gestion_user:admin@localhost:5432/gestion_del_fin_test

      - name: Run performance tests
        run: npm run test:perf
        env:
          DATABASE_URL: postgresql://gestion_user:admin@localhost:5432/gestion_del_fin_test
